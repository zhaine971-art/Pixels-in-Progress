<!-- Hangman Game Script -->
<script>
const logo = `
 _                                             
| |                                            
| |__   __ _ _ __   __ _ _ __ ___   __ _ _ __  
| '_ \\ / _\` | '_ \\ / _\` | '_ \` _ \\ / _\` | '_ \\ 
| | | | (_| | | | | (_| | | | | | | (_| | | | |
|_| |_|\\__,_|_| |_|\\__, |_| |_| |_|\\__,_|_| |_|
                    __/ |                      
|___/    
`;


    const stages = [
`  +---+
  |   |
  O   |
 /|\\  |
 / \\  |
      |
=========
`,
`  +---+
  |   |
  O   |
 /|\\  |
 /    |
      |
=========
`,
`  +---+
  |   |
  O   |
 /|\\  |
      |
      |
=========
`,
`  +---+
  |   |
  O   |
 /|   |
      |
      |
=========
`,
`  +---+
  |   |
  O   |
  |   |
      |
      |
=========
`,
`  +---+
  |   |
  O   |
      |
      |
      |
=========
`,
`  +---+
  |   |
      |
      |
      |
      |
=========
`
];

    const wordList = [
        "apple", "banana", "orange", "grape", "peach", "melon", "berry", "mango", "lemon", "lime",
        "chair", "table", "couch", "shelf", "drawer", "window", "curtain", "pillow", "blanket", "lamp",
        "dog", "cat", "horse", "sheep", "goat", "tiger", "lion", "zebra", "monkey", "rabbit",
        "cloud", "storm", "rain", "thunder", "lightning", "breeze", "tornado", "hurricane", "sunshine", "shadow",
        "river", "ocean", "forest", "desert", "island", "mountain", "valley", "canyon", "meadow", "jungle",
        "pizza", "burger", "taco", "pasta", "salad", "cookie", "donut", "candy", "cheese", "butter",
        "robot", "engine", "rocket", "planet", "galaxy", "comet", "asteroid", "spaceship", "gravity", "orbit",
        "wizard", "dragon", "castle", "knight", "sword", "shield", "magic", "potion", "goblin", "treasure",
        "phone", "keyboard", "screen", "mouse", "battery", "camera", "speaker", "charger", "router", "tablet"
    ];

    document.getElementById("logo").textContent = logo + "\n" + stages[6];

    let randomWord = wordList[Math.floor(Math.random() * wordList.length)];
    let lives = 6;
    let guessedLetters = [];
    let placeholder = Array(randomWord.length).fill("_");
    let gameOver = false;

    document.getElementById("placeholder").textContent = placeholder.join("");
    document.getElementById("lives").textContent = `Lives: ${lives}`;

    document.getElementById("guessBtn").addEventListener("click", () => {
        if (gameOver) return;

        const input = document.getElementById("guessInput");
        const guess = input.value.toLowerCase();
        input.value = "";

        if (!guess.match(/[a-z]/i)) return;
        if (guessedLetters.includes(guess)) {
            document.getElementById("message").textContent = "You already guessed that letter!";
            return;
        }

        guessedLetters.push(guess);

        if (randomWord.includes(guess)) {
            for (let i = 0; i < randomWord.length; i++) {
                if (randomWord[i] === guess) {
                    placeholder[i] = guess;
                }
            }
        } else {
            lives--;
            document.getElementById("message").textContent = "Wrong guess!";
        }

        document.getElementById("placeholder").textContent = placeholder.join("");
        document.getElementById("lives").textContent = `Lives: ${lives}`;

        // EXACTLY like Python: stages[lives]
        document.getElementById("logo").textContent = logo + "\n" + stages[lives];

        if (lives === 0) {
            gameOver = true;
            document.getElementById("message").textContent = `You lose! The word was: ${randomWord}`;
        }

        if (placeholder.join("") === randomWord) {
            gameOver = true;
            document.getElementById("message").textContent = "You win!";
        }
    });
</script>
