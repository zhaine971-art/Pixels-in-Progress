<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login – Pixels in Progress</title>

    <meta name="description" content="Login to your Pixels in Progress account.">
    <meta name="keywords" content="login, account, programming blog">
    <meta name="author" content="Zach">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <div class="banner">
        <img src="images/banner2.jpg" alt="Pixels in Progress Banner">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="posts.html">Posts</a>
        <a href="legal.html">Legal</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
<div class="content-container">

    <h1>Login</h1>

    <p>Welcome back! Enter your email and password to access your account.</p>

    <form id="login-form" style="max-width: 400px; margin: 0 auto;">
        <label>Email</label>
        <input type="email" id="login-email" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc;">

        <label>Password</label>
        <input type="password" id="login-password" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc;">

        <button type="submit" style="width: 100%; padding: 10px; background-color: black; color: white; border: none; border-radius: 6px; cursor: pointer;">
            Login
        </button>
    </form>

    <p id="login-message" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>

    <p style="text-align: center; margin-top: 20px;">
        Don't have an account? <a href="signup.html">Sign up here</a>.
    </p>

</div>

<footer>
    <p>&copy; 2026 Pixels in Progress</p>
    <p>Sharing my journey from beginner to developer.</p>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="posts.html">Posts</a>
        <a href="legal.html">Legal</a>
    </nav>
</footer>

</main>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your Supabase client -->
<script src="js/supabaseClient.js"></script>

<!-- Login Logic -->
<script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("login-message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            message.textContent = "Error: " + error.message;
            message.style.color = "red";
        } else {
            message.textContent = "Logged in successfully!";
            message.style.color = "green";
        }
    });
</script>


</body>
</html>
